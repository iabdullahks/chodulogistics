openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Freight quote and contact form submissions
  - name: shipments
    description: Shipment tracking
  - name: admin-auth
    description: Admin portal authentication
  - name: admin-shipments
    description: Admin shipment management
  - name: admin-leads
    description: Admin quote/contact submission management
  - name: admin-users
    description: Admin user management
  - name: admin-roles
    description: Admin role listing
  - name: admin-loads
    description: Admin load/dispatch management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a quote request or contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
  /shipments/{trackingNumber}:
    get:
      operationId: trackShipment
      tags: [shipments]
      summary: Look up a shipment by tracking number
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shipment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Shipment not found
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: Log in to the admin portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: Log out of the admin portal
      responses:
        "204":
          description: Logged out
  /admin/me:
    get:
      operationId: adminMe
      tags: [admin-auth]
      summary: Get the current logged-in admin user
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
  /admin/shipments:
    get:
      operationId: adminListShipments
      tags: [admin-shipments]
      summary: List all shipments
      responses:
        "200":
          description: Shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
        "401":
          description: Not authenticated
    post:
      operationId: adminCreateShipment
      tags: [admin-shipments]
      summary: Create a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
  /admin/shipments/{id}:
    patch:
      operationId: adminUpdateShipment
      tags: [admin-shipments]
      summary: Update a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdateInput"
      responses:
        "200":
          description: Shipment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Shipment not found
    delete:
      operationId: adminDeleteShipment
      tags: [admin-shipments]
      summary: Delete a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Shipment deleted
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Shipment not found
  /admin/leads:
    get:
      operationId: adminListLeads
      tags: [admin-leads]
      summary: List all quote/contact submissions
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Not authenticated
  /admin/leads/{id}:
    patch:
      operationId: adminUpdateLead
      tags: [admin-leads]
      summary: Update a lead's status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdateInput"
      responses:
        "200":
          description: Lead updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Lead not found
  /admin/loads:
    get:
      operationId: adminListLoads
      tags: [admin-loads]
      summary: List all loads
      responses:
        "200":
          description: Loads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Load"
        "401":
          description: Not authenticated
    post:
      operationId: adminCreateLoad
      tags: [admin-loads]
      summary: Create a load
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadInput"
      responses:
        "201":
          description: Load created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Load"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
  /admin/loads/{id}:
    patch:
      operationId: adminUpdateLoad
      tags: [admin-loads]
      summary: Update a load
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadUpdateInput"
      responses:
        "200":
          description: Load updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Load"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Load not found
    delete:
      operationId: adminDeleteLoad
      tags: [admin-loads]
      summary: Delete a load
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Load deleted
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Load not found
  /admin/roles:
    get:
      operationId: adminListRoles
      tags: [admin-roles]
      summary: List all roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          description: Not authenticated
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin-users]
      summary: List all admin users
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
    post:
      operationId: adminCreateUser
      tags: [admin-users]
      summary: Create a new admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateInput"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "409":
          description: Email already in use
  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      tags: [admin-users]
      summary: Update an admin user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateInput"
      responses:
        "200":
          description: Admin user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Admin user not found
        "409":
          description: Email already in use
    delete:
      operationId: adminDeleteUser
      tags: [admin-users]
      summary: Delete an admin user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Admin user deleted
        "400":
          description: Cannot delete your own account
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permissions
        "404":
          description: Admin user not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Lead:
      type: object
      required:
        [id, fullName, email, phone, companyName, subject, serviceInterested, message, status, notes, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        companyName: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        serviceInterested: { type: ["string", "null"] }
        message: { type: string }
        status: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    LeadInput:
      type: object
      required: [fullName, email, phone, message]
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        companyName: { type: string }
        subject: { type: string }
        serviceInterested: { type: string }
        message: { type: string, minLength: 1 }
    LeadUpdateInput:
      type: object
      properties:
        status: { type: string }
        notes: { type: string }
    Shipment:
      type: object
      required:
        [id, trackingNumber, status, origin, destination, carrierName, estimatedDelivery, lastUpdate]
      properties:
        id: { type: integer }
        trackingNumber: { type: string }
        status: { type: string }
        origin: { type: string }
        destination: { type: string }
        carrierName: { type: string }
        estimatedDelivery: { type: string, format: date-time }
        lastUpdate: { type: string }
    ShipmentInput:
      type: object
      required: [trackingNumber, status, origin, destination, carrierName, estimatedDelivery, lastUpdate]
      properties:
        trackingNumber: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        origin: { type: string, minLength: 1 }
        destination: { type: string, minLength: 1 }
        carrierName: { type: string, minLength: 1 }
        estimatedDelivery: { type: string, format: date-time }
        lastUpdate: { type: string, minLength: 1 }
    ShipmentUpdateInput:
      type: object
      properties:
        trackingNumber: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        origin: { type: string, minLength: 1 }
        destination: { type: string, minLength: 1 }
        carrierName: { type: string, minLength: 1 }
        estimatedDelivery: { type: string, format: date-time }
        lastUpdate: { type: string, minLength: 1 }
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AdminUser:
      type: object
      required: [id, email, name, roleName]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        roleName: { type: string }
    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        permissions:
          type: object
          additionalProperties: { type: string }
    AdminUserDetail:
      type: object
      required: [id, email, name, roleId, roleName, isActive, lastLoginAt, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        roleId: { type: integer }
        roleName: { type: string }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUserCreateInput:
      type: object
      required: [email, name, password, roleId]
      properties:
        email: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        roleId: { type: integer }
    AdminUserUpdateInput:
      type: object
      properties:
        email: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        roleId: { type: integer }
        isActive: { type: boolean }
    Load:
      type: object
      required:
        [id, trackingId, status, carrierName, dot, truck, outboundRate, startDate, createdAt]
      properties:
        id: { type: integer }
        trackingId: { type: string }
        status: { type: string }
        carrierName: { type: string }
        dot: { type: ["string", "null"] }
        truck: { type: ["string", "null"] }
        outboundRate: { type: number }
        startDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    LoadInput:
      type: object
      required: [trackingId, status, carrierName, outboundRate, startDate]
      properties:
        trackingId: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        carrierName: { type: string, minLength: 1 }
        dot: { type: string }
        truck: { type: string }
        outboundRate: { type: number }
        startDate: { type: string, format: date }
    LoadUpdateInput:
      type: object
      properties:
        trackingId: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        carrierName: { type: string, minLength: 1 }
        dot: { type: string }
        truck: { type: string }
        outboundRate: { type: number }
        startDate: { type: string, format: date }

